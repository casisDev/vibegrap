name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas do sistema (tela virtual, ffmpeg, Tk)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg python3-tk

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Rodar os testes
        run: xvfb-run -a python tests/test_app.py
